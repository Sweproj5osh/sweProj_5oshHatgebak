name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests-and-fitness:
    runs-on: ubuntu-latest
    # ADR-21: the tests run only against a real PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sayes
          POSTGRES_PASSWORD: sayes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      POSTGRES_URL: postgres://sayes:sayes@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fitness

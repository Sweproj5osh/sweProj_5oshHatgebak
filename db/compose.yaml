# Local PostgreSQL for development and tests (docs/setup/database.md). A developer tool, not a runtime dependency.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sayes
      POSTGRES_PASSWORD: sayes
    ports:
      - "5433:5432"   # host port 5433: 5432 is often taken by a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayes"]
      interval: 2s
      timeout: 3s
      retries: 15
